[alias]
c = "check --workspace --all-features"
b = "build --workspace --all-features"
br = "build --workspace --release"
r = "run -p sandbox"
cl = "clippy --workspace --all-features -- -D warnings"
f = "fmt --all"
docx = "doc --workspace --all-features --no-deps"

[build]
jobs = 8

[env]
RUST_LOG = "warn,diene_common=debug,diene_engine_runtime=debug,diene_engine_core=debug,diene_engine_renderer_vulkan=debug,sandbox=debug"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
